<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>douwe teusink — contact</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <style>
    .contact-wrap {
      max-width: 640px;
      margin: 48px auto 0;
      padding: 0 var(--frame);
    }
    .contact-wrap h2 {
      font-style: italic;
      margin: 0 0 32px;
    }
    .contact-block {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 12px;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
    }
    .contact-label {
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    .contact-block a {
      color: var(--ink);
      text-decoration: none;
    }
    .contact-block a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
<header class="site-header">
  <div class="hy-lines" id="hy-lines">
    <div class="hy-line hy-plain" data-left="" data-center="" data-right=""></div>
    <div class="hy-line" data-left="" data-center="douwe teusink" data-right=""></div>
    <div class="hy-line" data-left="" data-center="portfolio" data-right="" data-accent="true"></div>
    <div class="hy-line hy-plain" data-left="" data-center="" data-right=""></div>
  </div>
</header>

<nav class="top-nav">
  <a href="index.html" class="nav-link">work</a>
  <a href="about.html" class="nav-link">about</a>
  <a href="contact.html" class="nav-link">contact</a>
</nav>

<main>
  <div class="contact-wrap">
    <h2>contact</h2>

    <div class="contact-block">
      <span class="contact-label">email</span>
      <a href="mailto:douweteusink@hotmail.com">douweteusink@hotmail.com</a>
    </div>


    <div class="contact-block">
      <span class="contact-label">location</span>
      <span>Utrecht</span>
    </div>

  </div>
</main>

<footer class="site-footer">
  <p class="copy">&copy; <span id="year">2025</span> douwe teusink</p>
</footer>
<script src="lines.js"></script>
</body>
</html>
